[project]
name = "bgcam"
version = "0.1.0"
description = "Webcam virtuelle : détourage, flou ou fond animé, changement de fond par gestes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe>=0.10.14",
    "numpy",
    "pillow>=10",
    "pyvirtualcam>=0.11",
]

[project.scripts]
bgcam = "bgcam:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["bgcam.py"]
